[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fromcad2cfd"
version = "0.3.0rc0"
description = "FastAgent: A Physics-Aware FastFluent-to-Fluent Workflow for Rapid CFD Screening and Industrial Steam Dewaxing Design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Chen YanKai", email = "chenyankai02@gmail.com" },
  { name = "Yuan Man" },
  { name = "Zou Ting" },
  { name = "Xu QingYan", email = "scjxqy@tsinghua.edu.cn" },
  { name = "Jing Tao", email = "jingtao@mail.tsinghua.edu.cn" },
]
keywords = ["FastFluent", "Fluent", "CFD", "solid-liquid dynamics", "agent", "paper reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1,<2"]
paper-validation = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Yan-Kai-Chen/An-Agent-Framework-for-FastFluent-to-Fluent-Simulation-of-Complex-Solid-Liquid-Dynamics"
Repository = "https://github.com/Yan-Kai-Chen/An-Agent-Framework-for-FastFluent-to-Fluent-Simulation-of-Complex-Solid-Liquid-Dynamics"
Paper = "https://arxiv.org/abs/2611.00645"

[project.scripts]
fromcad2cfd = "fromcad2cfd.cli:main"
fromcad2cfd-nx-mcp = "fromcad2cfd_mcp_nx.server:main"
fromcad2cfd-fluent-solver-mcp = "fromcad2cfd_mcp_fluent_solver.server:main"
fromcad2cfd-hypermesh-meshing-mcp = "fromcad2cfd_mcp_hypermesh_meshing.server:main"
fromcad2cfd-post-mcp = "fromcad2cfd_mcp_postprocessing.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
