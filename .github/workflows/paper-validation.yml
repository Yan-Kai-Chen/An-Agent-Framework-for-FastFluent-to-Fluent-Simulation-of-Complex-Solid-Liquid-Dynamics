name: paper-validation

on:
  push:
  pull_request:

jobs:
  level1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev,paper-validation]"
      - name: Validate claims
        run: python paper_validation/scripts/validate_claims.py --frozen
      - name: Build paper assets
        run: python paper_validation/build_paper_assets.py --from-frozen
      - name: Run paper-validation tests
        run: python -m pytest tests/paper_validation -q
