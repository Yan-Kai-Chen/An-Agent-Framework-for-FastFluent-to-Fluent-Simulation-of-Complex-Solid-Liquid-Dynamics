name: Syntax

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse source and public validation scripts
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p)) for root in ('src', 'paper_validation', 'tests') for p in pathlib.Path(root).rglob('*.py')]"
